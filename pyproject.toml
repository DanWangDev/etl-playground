[project]
name = "etl-playground"
version = "0.1.0"
description = "Hands-on ETL pipeline playground — build a credible data engineering pipeline from scratch"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5,<4.0",       # Spark DataFrame API (local mode)
    "duckdb>=1.1",              # Athena/Redshift equivalent SQL engine
    "pyarrow>=16.0",            # Parquet/Arrow support
    "pydantic>=2.7",            # Schema validation, settings
    "pydantic-settings>=2.3",   # Env-based config
    "python-dotenv>=1.0",       # .env loading
    "rich>=13.7",               # Beautiful CLI output (logging)
    "pyyaml>=6.0",              # Schema registry YAML parsing
    "streamlit>=1.37",          # Dashboard (QuickSight equivalent)
    "altair>=5.3",              # Declarative charts for Streamlit
    "pandas>=2.2",              # Small-data utilities
    "faker>=28.0",              # Synthetic data generation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
streaming = [
    "kafka-python>=2.0",        # Redpanda/Kafka client (Phase 2)
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/etl_playground"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["N812", "N818"]

[tool.ruff.lint.per-file-ignores]
# M01 generator: many long lines in title generation logic
"src/etl_playground/m01_data_generator/generators.py" = ["E501"]
# M02 Spark foundation: Spark config log lines
"src/etl_playground/m02_spark_foundation/exercise.py" = ["E501"]
# M03 modules: lots of explanatory log strings
"src/etl_playground/m03_etl_transform/*.py" = ["E501"]
# M05 benchmark: SQL strings
"src/etl_playground/m05_benchmark/*.py" = ["E501"]
# M06 incremental: log strings
"src/etl_playground/m06_incremental_etl/*.py" = ["E501"]
# M08 warehouse: SQL strings
"src/etl_playground/m08_warehouse/*.py" = ["E501"]
# M09 dashboard: Streamlit column config
"src/etl_playground/m09_dashboard/*.py" = ["E501"]
# Shared: duckdb regex, logging table_triple signature
"src/etl_playground/shared/duckdb.py" = ["E501"]
"src/etl_playground/shared/logging.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
